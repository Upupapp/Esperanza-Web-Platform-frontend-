[build]
  # 1. Install PHP deps  2. Install JS deps  3. Vite build  4. Export to static HTML
  command = "composer install --no-dev --optimize-autoloader && npm ci && npm run build && mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache storage/logs && chmod -R 777 storage bootstrap/cache && APP_URL=$URL php export.php"
  publish  = "dist"

[build.environment]
  PHP_VERSION    = "8.3"
  NODE_VERSION   = "20"
  APP_ENV        = "production"
  APP_DEBUG      = "false"
  # APP_KEY must be set as a secret in the Netlify UI — do NOT put it here.
  # Project configuration → Environment variables → Add variable
  #   Key:   APP_KEY
  #   Value: <the APP_KEY -- read it from the Netlify UI or your local .env>
  #
  # The literal key used to be reproduced here. It is redacted because this is
  # a PUBLIC repository (F-003). Redacting does not un-leak it: the value is
  # still in this file's git history and MUST be rotated.

  # Use in-memory drivers — this is a frontend-only static export, no DB needed.
  DB_CONNECTION      = "sqlite"
  DB_DATABASE        = ":memory:"
  CACHE_STORE        = "array"
  SESSION_DRIVER     = "array"
  QUEUE_CONNECTION   = "sync"
  LOG_CHANNEL        = "stderr"
  BROADCAST_CONNECTION = "log"
  FILESYSTEM_DISK    = "local"

  # Read at BUILD time by Vite for the browser-side API client (TAB 05).
  # Point this at the real API origin before the first production deploy.
  VITE_API_BASE_URL  = "/api"
  VITE_API_TIMEOUT_MS = "15000"

# ── Redirect rules ────────────────────────────────────────────────────────────
# All known routes have an index.html in dist/; Netlify serves them automatically.
# The rules below handle the /logout alias and a catch-all 404 fallback.

[[redirects]]
  from   = "/logout"
  to     = "/"
  status = 302

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404
