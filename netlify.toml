[build]
  # 1. Install PHP deps  2. Install JS deps  3. Vite build  4. Export to static HTML
  command = "composer install --no-dev --optimize-autoloader && npm ci && npm run build && mkdir -p storage/framework/views storage/framework/sessions storage/framework/cache storage/logs && chmod -R 777 storage bootstrap/cache && APP_URL=$URL php export.php"
  publish  = "dist"

[build.environment]
  PHP_VERSION    = "8.3"
  NODE_VERSION   = "20"
  APP_ENV        = "production"
  APP_DEBUG      = "false"
  # APP_KEY must be set as a secret in the Netlify UI — never in this file.
  #   Project configuration → Environment variables → Add variable
  #   Key:   APP_KEY      Value: <paste from your local .env, never from here>
  #
  # ── F-003: the old key is PUBLIC. Rotation runbook ────────────────────────
  # A literal APP_KEY was committed in this comment. It is redacted now, but
  # redaction does not un-leak it: it remains readable in this file's git
  # history (commits c8388af and e3e3f04) and this is a public repository.
  # Rewriting that history is NOT the remedy — it would force-push over every
  # clone and anyone who cloned already has the value. Rotation is the remedy.
  #
  # Done:     the local .env key was rotated 2026-08-30 (`php artisan
  #           key:generate`), so the leaked value is no longer in local use,
  #           and it was verified not to be reused by any other local project.
  # REMAINING, and only a human with Netlify access can do it:
  #   1. php artisan key:generate      (locally, if you have not already)
  #   2. copy the new APP_KEY out of .env  — .env is gitignored, keep it so
  #   3. Netlify → Project configuration → Environment variables → APP_KEY
  #      → edit → paste the new value → save
  #   4. trigger a redeploy so the build picks it up
  #
  # Blast radius, measured rather than assumed: production is a STATIC EXPORT
  # (publish = "dist"), so Laravel never runs for a visitor and APP_KEY is used
  # only at build time to boot the app during export.php. Nothing in this app
  # encrypts or decrypts anything, and SESSION/CACHE/QUEUE are all in-memory.
  # So the leaked key protects nothing here — the real risk was reuse of the
  # same string in another Laravel app, which was checked and did not occur.
  # Rotate anyway: a published key should never stay in service.

  # Use in-memory drivers — this is a frontend-only static export, no DB needed.
  DB_CONNECTION      = "sqlite"
  DB_DATABASE        = ":memory:"
  CACHE_STORE        = "array"
  SESSION_DRIVER     = "array"
  QUEUE_CONNECTION   = "sync"
  LOG_CHANNEL        = "stderr"
  BROADCAST_CONNECTION = "log"
  FILESYSTEM_DISK    = "local"

  # Read at BUILD time by Vite for the browser-side API client (TAB 05).
  #
  # Committed default: the backend's staging deployment on the shared LGU IDS
  # Linode (production-readiness programme, 2026-09-25). This is a real,
  # reachable API — not a placeholder — so a build that goes out with no
  # Netlify UI override still calls something real instead of 404ing against
  # `/api` on a static-export origin that serves no such path.
  #
  # A Netlify UI env var of the same name OVERRIDES this file's value (Netlify's
  # own precedence), so pointing production at a different backend (a future
  # dedicated production deployment, distinct from this staging box) needs no
  # code change:
  #   Netlify → Project configuration → Environment variables → VITE_API_BASE_URL
  #   → set to the production API's own /api/v1 origin → trigger a redeploy.
  VITE_API_BASE_URL  = "https://esperanza.139-162-51-165.sslip.io/api/v1"
  VITE_API_TIMEOUT_MS = "15000"

# ── Redirect rules ────────────────────────────────────────────────────────────
# All known routes have an index.html in dist/; Netlify serves them automatically.
# The rules below handle the /logout alias and a catch-all 404 fallback.

[[redirects]]
  from   = "/logout"
  to     = "/"
  status = 302

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404
